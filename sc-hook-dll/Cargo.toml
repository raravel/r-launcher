[package]
name = "sc-hook-dll"
version = "0.3.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Memory",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_Performance",
    "Win32_Security",
    "Win32_Networking_WinSock",
] }
once_cell = "1"
parking_lot = "0.12"
minhook = "0.9"

[profile.release]
opt-level = 3
lto = true
